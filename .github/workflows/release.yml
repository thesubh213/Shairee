name: 'Release Build'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 'Build Windows Installer'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install System Dependencies
        run: npm ci

      - name: Compile Windows Packages
        run: npx tauri build

      - name: Prepare Clean Release Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-output
          Copy-Item src-tauri/target/release/bundle/msi/*.msi build-output/Shairee.msi
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe build-output/Shairee.exe

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: build-output/Shairee.msi
          if-no-files-found: error

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build-output/Shairee.exe
          if-no-files-found: error

  build-android:
    name: 'Build Android APK'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'tools platform-tools ndk;29.0.14206865'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'src-tauri/gen/android/build.gradle.kts', 'src-tauri/gen/android/app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install System Dependencies
        run: npm ci

      - name: Initialize Android Platform
        run: npx tauri android init --ci

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set; release APK will be debug-signed."
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/release.keystore
          fi

      - name: Inject Android P2P Sharing Capabilities
        run: |
          python3 -c '
          import os
          import textwrap
          
          # Manifest injection
          manifest_path = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              manifest = f.read()
          perms = """
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
          """
          if "CHANGE_WIFI_MULTICAST_STATE" not in manifest:
              manifest = manifest.replace("<application", perms + "    <application")
          with open(manifest_path, "w") as f:
              f.write(manifest)
          
          # MainActivity overwrite with correct multicast lock code and imports
          activity_path = "src-tauri/gen/android/app/src/main/java/com/shairee/portal/MainActivity.kt"
          code = textwrap.dedent("""\
              package com.shairee.portal
              
              import android.os.Bundle
              import android.content.Context
              import android.net.wifi.WifiManager
              
              class MainActivity : TauriActivity() {
                  private var multicastLock: WifiManager.MulticastLock? = null
              
                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      try {
                          val wifi = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          multicastLock = wifi.createMulticastLock("ShaireeMulticastLock")
                          multicastLock?.setReferenceCounted(true)
                          multicastLock?.acquire()
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              
                  override fun onDestroy() {
                      super.onDestroy()
                      try {
                          multicastLock?.let {
                              if (it.isHeld) {
                                  it.release()
                              }
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }
          """)
          with open(activity_path, "w") as f:
              f.write(code)
          '

      - name: Compile Android Release APK
        env:
          SHAIREE_KEYSTORE_PATH: ${{ github.workspace }}/src-tauri/gen/android/app/release.keystore
          SHAIREE_KEYSTORE_PASSWORD: ${{ secrets.SHAIREE_KEYSTORE_PASSWORD }}
          SHAIREE_KEY_ALIAS: ${{ secrets.SHAIREE_KEY_ALIAS }}
          SHAIREE_KEY_PASSWORD: ${{ secrets.SHAIREE_KEY_PASSWORD }}
        run: |
          export NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865
          npx tauri android build

      - name: Prepare Android APK for Release
        run: |
          mkdir -p build-output
          # Find output release APK signed by Gradle
          signed_apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release.apk" | head -n 1)
          if [ -n "$signed_apk" ]; then
            cp "$signed_apk" build-output/Shairee.apk
          else
            echo "Error: Gradle release APK not found!"
            exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build-output/Shairee.apk
          if-no-files-found: error

  publish-release:
    name: 'Publish GitHub Release'
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: release-artifacts

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-artifacts

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/Shairee.msi
            release-artifacts/Shairee.exe
            release-artifacts/Shairee.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

