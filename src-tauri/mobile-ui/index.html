<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHAIREE — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --colors-canvas: #ffffff;
    --colors-ink: #111111;
    --colors-soft-cloud: #f5f5f5;
    --colors-hairline: #cacacb;
    --colors-hairline-soft: #e5e5e5;
    --colors-sale: #d30005;
    --colors-success: #007d48;
    --colors-info: #1151ff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --colors-canvas: #111111;
      --colors-ink: #ffffff;
      --colors-soft-cloud: #1c1c1e;
      --colors-hairline: #2c2c2e;
      --colors-hairline-soft: #3a3a3c;
      --colors-sale: #ff3333;
      --colors-success: #1eaa52;
      --colors-info: #3b82f6;
    }
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--colors-canvas);
    color: var(--colors-ink);
    min-height: 100vh;
    display: flex;
    flex-col: column;
    flex-direction: column;
    padding-bottom: 40px;
    transition: background-color 0.2s, color 0.2s;
  }



  /* Header */
  header {
    height: 64px;
    border-bottom: 1px solid var(--colors-hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background-color: var(--colors-canvas);
    position: sticky;
    top: 0;
    z-index: 40;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 0.05em;
  }

  .brand svg {
    width: 24px;
    height: 24px;
    stroke: var(--colors-ink);
  }

  /* Editorial Hero Campaign Section */
  .hero {
    background-color: var(--colors-ink);
    color: var(--colors-canvas);
    padding: 32px 16px;
    position: relative;
    overflow: hidden;
    user-select: none;
    border-bottom: 1px solid var(--colors-hairline);
  }

  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.05;
    background-image: linear-gradient(var(--colors-hairline) 1px, transparent 1px), linear-gradient(90deg, var(--colors-hairline) 1px, transparent 1px);
    background-size: 20px 20px;
    pointer-events: none;
  }

  .hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 10vw, 54px);
    line-height: 0.9;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }

  .hero-subtitle {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-top: 8px;
  }

  /* Main Container */
  main {
    flex: 1;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* Section Titles */
  .section-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--colors-hairline);
    padding-bottom: 8px;
    margin-bottom: 16px;
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .section-meta {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--colors-hairline);
  }

  /* Download All CTA Pill */
  .zip-all-btn {
    display: none;
    width: 100%;
    height: 48px;
    background-color: var(--colors-ink);
    color: var(--colors-canvas);
    border: none;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    margin-bottom: 24px;
    transition: transform 0.15s, opacity 0.15s;
  }

  .zip-all-btn:active {
    transform: scale(0.97);
    opacity: 0.9;
  }

  /* Files list layout */
  .file-list {
    list-style: none;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  @media (min-width: 480px) {
    .file-list {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (min-width: 768px) {
    .file-list {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  .file-item {
    border: 1px solid var(--colors-hairline);
    background-color: var(--colors-canvas);
    display: flex;
    align-items: center;
    padding: 12px;
    position: relative;
  }

  /* Product-style left stage visual */
  .file-stage {
    width: 48px;
    height: 48px;
    background-color: var(--colors-soft-cloud);
    border-right: 1px solid var(--colors-hairline-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-right: 14px;
    flex-shrink: 0;
  }

  .file-stage-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 0.05em;
    opacity: 0.5;
  }

  .file-swatch-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    position: absolute;
    top: 4px;
    left: 4px;
    border: 1px solid var(--colors-canvas);
  }

  .file-info {
    flex: 1;
    min-width: 0;
    margin-right: 12px;
  }

  .file-name {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-size {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--colors-hairline);
    margin-top: 2px;
    display: block;
  }

  /* Sleek small pill download button */
  .dl-btn {
    height: 32px;
    padding: 0 16px;
    background-color: var(--colors-soft-cloud);
    color: var(--colors-ink);
    border: 1px solid var(--colors-hairline);
    border-radius: 9999px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background-color 0.15s;
  }

  .dl-btn:active {
    transform: scale(0.95);
    background-color: var(--colors-hairline-soft);
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 16px;
    border: 1px dashed var(--colors-hairline);
    background-color: var(--colors-canvas);
  }

  .empty-state svg {
    width: 32px;
    height: 32px;
    stroke: var(--colors-hairline);
    margin-bottom: 12px;
  }

  .empty-state-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .empty-state-subtitle {
    font-size: 9px;
    font-weight: 500;
    color: var(--colors-hairline);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* PIN Security Login Stage */
  .auth-container {
    display: none;
    border: 1px solid var(--colors-ink);
    padding: 32px 24px;
    background-color: var(--colors-canvas);
    flex-direction: column;
    gap: 20px;
    animation: fadeIn 0.3s ease-out;
    max-width: 360px;
    margin: 0 auto;
    width: 100%;
  }

  .auth-lock-icon {
    width: 44px;
    height: 44px;
    background-color: var(--colors-soft-cloud);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 8px;
    border: 1px solid var(--colors-hairline-soft);
  }

  .auth-lock-icon svg {
    width: 20px;
    height: 20px;
    stroke: var(--colors-ink);
  }

  .auth-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-align: center;
  }

  .auth-subtitle {
    font-size: 11px;
    font-weight: 500;
    text-align: center;
    color: var(--colors-hairline);
    line-height: 1.5;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .auth-input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }

  .auth-input {
    width: 100%;
    height: 44px;
    background-color: var(--colors-soft-cloud);
    color: var(--colors-ink);
    border: 1px solid transparent;
    padding: 0 16px;
    font-family: monospace;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.25em;
    outline: none;
    transition: border-color 0.2s;
  }

  .auth-input:focus {
    border-color: var(--colors-ink);
    background-color: var(--colors-canvas);
  }

  .auth-btn {
    width: 100%;
    height: 44px;
    background-color: var(--colors-ink);
    color: var(--colors-canvas);
    border: none;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: transform 0.15s;
  }

  .auth-btn:active {
    transform: scale(0.97);
  }

  .auth-error {
    display: none;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--colors-sale);
    text-align: center;
    background-color: rgba(211, 0, 5, 0.05);
    border: 1px solid rgba(211, 0, 5, 0.15);
    padding: 10px;
  }

  /* Fade animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Footer */
  footer {
    border-top: 1px solid var(--colors-hairline);
    background-color: var(--colors-canvas);
    padding: 24px 16px;
    text-align: center;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--colors-hairline);
    margin-top: auto;
    user-select: none;
  }
</style>
</head>
<body>


  <!-- Header -->
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 6l-4 5h3.5l-1.5 7 5-6h-3.5l1-6z" fill="#f59e0b" stroke="none" />
        <path d="M18.36 5.64a9 9 0 0 1 0 12.72" />
        <path d="M5.64 5.64a9 9 0 0 0 0 12.72" />
        <path d="M15.54 8.46a5 5 0 0 1 0 7.08" />
        <path d="M8.46 8.46a5 5 0 0 0 0 7.08" />
      </svg>
      <span>SHAIREE</span>
    </div>
  </header>

  <!-- Hero Campaign -->
  <section class="hero">
    <h1 class="hero-title">FAST.<br>LOCAL.<br>UNRESTRICTED.</h1>
    <p class="hero-subtitle">DIRECT peer file gateway. zero cloud.</p>
  </section>

  <!-- Main Area -->
  <main>
    <!-- Authentication PIN box -->
    <div id="auth-box" class="auth-container">
      <div class="auth-lock-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2 class="auth-title">ENTER PIN</h2>
      <p class="auth-subtitle">Protected portal. Please input the session passcode.</p>
      
      <div class="auth-input-group">
        <input type="password" id="pin-input" class="auth-input" maxlength="8" placeholder="••••">
        <button id="auth-submit-btn" class="auth-btn" onclick="submitPin()">CONNECT</button>
      </div>
      <div id="auth-error-msg" class="auth-error">Incorrect passcode. Please try again.</div>
    </div>

    <!-- Active Sharing portal list -->
    <div id="portal-content">
      <button id="zip-all" class="zip-all-btn" onclick="downloadAll()">⬇ Download All (ZIP)</button>

      <div class="section-header">
        <h2 class="section-title">SHARED PRODUCTS</h2>
        <span id="shared-count" class="section-meta">0 ITEMS</span>
      </div>

      <ul id="file-list" class="file-list">
        <!-- populated dynamically -->
      </ul>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    © 2026 SHAIREE SYSTEM INC. ALL LOCAL RIGHTS RESERVED.
  </footer>

<script>
  const API = location.origin;
  let sessionPin = sessionStorage.getItem('shairee-pin') || '';
  let wsConnected = false;

  function setStatusConnected(connected) {
    wsConnected = connected;
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (dot) {
      dot.className = connected ? 'status-dot online' : 'status-dot';
    }
    if (text) {
      text.textContent = connected ? 'HOST ONLINE' : 'DISCONNECTED';
    }
  }

  async function load() {
    const portalContent = document.getElementById('portal-content');
    const authBox = document.getElementById('auth-box');
    const ul = document.getElementById('file-list');
    const zipBtn = document.getElementById('zip-all');
    const countLabel = document.getElementById('shared-count');

    try {
      const headers = {};
      if (sessionPin) {
        headers['Authorization'] = 'Bearer ' + sessionPin;
      }
      
      const res = await fetch(API + '/api/files', { headers });

      if (res.status === 401) {
        // Show auth box, hide portal files
        portalContent.style.display = 'none';
        authBox.style.display = 'flex';
        return;
      }

      if (res.status === 200) {
        // Auth OK
        portalContent.style.display = 'block';
        authBox.style.display = 'none';
        if (sessionPin) {
          sessionStorage.setItem('shairee-pin', sessionPin);
        }
        
        const files = await res.json();
        
        countLabel.textContent = files.length + (files.length === 1 ? ' ITEM' : ' ITEMS');

        if (!files.length) {
          zipBtn.style.display = 'none';
          ul.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
              <div class="empty-state-title">No files currently shared</div>
              <div class="empty-state-subtitle">Waiting for host to add items.</div>
            </div>
          `;
          return;
        }

        zipBtn.style.display = 'block';
        
        ul.innerHTML = files.map(f => {
          const ext = f.name.split('.').pop().toUpperCase();
          const sizeStr = humanSize(f.size);
          const dlUrl = `${API}/download/${f.id}/${encodeURIComponent(f.name)}?auth=${encodeURIComponent(sessionPin)}`;
          
          // Nike colors swatch logic based on file size
          let dotColor = 'var(--colors-success)'; // green < 10MB
          let textVisual = 'DOC';
          if (f.size > 100 * 1024 * 1024) {
            dotColor = 'var(--colors-sale)'; // red > 100MB
          } else if (f.size > 10 * 1024 * 1024) {
            dotColor = '#ff9900'; // amber 10MB - 100MB
          }

          // Simple type inference
          const extLower = ext.toLowerCase();
          if (['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'].includes(extLower)) {
            textVisual = 'IMG';
          } else if (['mp3', 'wav', 'flac', 'ogg', 'm4a'].includes(extLower)) {
            textVisual = 'AUD';
          } else if (['mp4', 'mkv', 'avi', 'mov', 'webm'].includes(extLower)) {
            textVisual = 'VID';
          } else if (['zip', 'rar', '7z', 'tar', 'gz'].includes(extLower)) {
            textVisual = 'ZIP';
          } else if (f.is_dir) {
            textVisual = 'DIR';
          }

          return `
            <li class="file-item">
              <div class="file-stage">
                <span class="file-swatch-dot" style="background-color: ${dotColor}"></span>
                <span class="file-stage-text">${textVisual}</span>
              </div>
              <div class="file-info">
                <span class="file-name" title="${esc(f.name)}">${esc(f.name)}</span>
                <span class="file-size">${sizeStr} • .${ext}</span>
              </div>
              <a class="dl-btn" href="${dlUrl}" download>GET</a>
            </li>
          `;
        }).join('');
      }
    } catch(e) {
      ul.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--colors-sale)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <div class="empty-state-title">Network Portal Error</div>
          <div class="empty-state-subtitle">Unable to connect to sharing host.</div>
        </div>
      `;
    }
  }

  async function submitPin() {
    const pin = document.getElementById('pin-input').value.trim();
    const errorEl = document.getElementById('auth-error-msg');
    
    if (!pin) return;
    
    sessionPin = pin;
    
    try {
      const headers = { 'Authorization': 'Bearer ' + pin };
      const res = await fetch(API + '/api/files', { headers });
      
      if (res.status === 200) {
        // Success
        errorEl.style.display = 'none';
        sessionStorage.setItem('shairee-pin', pin);
        load();
        
        // Reconnect WS with auth query parameter
        connectWS();
      } else {
        errorEl.style.display = 'block';
        sessionPin = '';
      }
    } catch(e) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Connection error. Please try again.';
      sessionPin = '';
    }
  }

  function downloadAll() {
    location.href = API + '/download-all?auth=' + encodeURIComponent(sessionPin);
  }

  function humanSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
    return (b/1073741824).toFixed(2) + ' GB';
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Auto-refresh via WebSocket
  let currentWs = null;
  function connectWS() {
    if (currentWs) {
      try { currentWs.close(); } catch(e) {}
    }

    try {
      // Append auth token to WS query parameters to authenticate connection
      const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + 
                    location.host + '/ws' + (sessionPin ? '?auth=' + encodeURIComponent(sessionPin) : '');
      
      const ws = new WebSocket(wsUrl);
      currentWs = ws;

      ws.onopen = () => {
        setStatusConnected(true);
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'files_changed') load();
        } catch(err) {}
      };

      ws.onclose = () => {
        setStatusConnected(false);
        console.log("WebSocket closed. Reconnecting in 5s...");
        setTimeout(connectWS, 5000);
      };

      ws.onerror = () => {
        setStatusConnected(false);
      };
    } catch(err) {
      setStatusConnected(false);
      setTimeout(connectWS, 5000);
    }
  }

  // Initial loads
  load();
  connectWS();
</script>
</body>
</html>
