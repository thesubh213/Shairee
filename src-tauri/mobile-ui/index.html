<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shairee — File Download</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 16px; }
  h1 { text-align: center; font-size: 1.6rem; margin: 16px 0; color: #38bdf8; }
  .subtitle { text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 0.9rem; }
  #file-list { list-style: none; }
  #file-list li { background: #1e293b; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
                  display: flex; justify-content: space-between; align-items: center; }
  #file-list li .name { font-weight: 500; word-break: break-all; flex: 1; }
  #file-list li .size { color: #94a3b8; font-size: 0.85rem; margin: 0 12px; white-space: nowrap; }
  .dl-btn { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 8px 16px;
            font-size: 0.9rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .dl-btn:hover { background: #1d4ed8; }
  .empty { text-align: center; color: #64748b; margin-top: 40px; font-size: 1.1rem; }
  #zip-all { display: block; margin: 0 auto 20px; background: #16a34a; color: #fff; border: none;
             border-radius: 10px; padding: 12px 28px; font-size: 1rem; cursor: pointer; }
  #zip-all:hover { background: #15803d; }
</style>
</head>
<body>
  <h1>📁 Shairee</h1>
  <p class="subtitle">Tap a file to download</p>
  <button id="zip-all" style="display:none;" onclick="downloadAll()">⬇ Download All (ZIP)</button>
  <ul id="file-list"><li class="empty">Loading…</li></ul>
<script>
  const API = location.origin;
  async function load() {
    try {
      const res = await fetch(API + '/api/files');
      const files = await res.json();
      const ul = document.getElementById('file-list');
      const zipBtn = document.getElementById('zip-all');
      if (!files.length) { ul.innerHTML = '<li class="empty">No files shared yet.</li>'; return; }
      zipBtn.style.display = 'block';
      ul.innerHTML = files.map(f =>
        `<li>
          <span class="name">${esc(f.name)}</span>
          <span class="size">${humanSize(f.size)}</span>
          <a class="dl-btn" href="${API}/download/${f.id}/${encodeURIComponent(f.name)}" download>Download</a>
        </li>`
      ).join('');
    } catch(e) { document.getElementById('file-list').innerHTML = '<li class="empty">Error loading files.</li>'; }
  }
  function downloadAll() { location.href = API + '/download-all'; }
  function humanSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
    return (b/1073741824).toFixed(2) + ' GB';
  }
  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  load();
  // Auto-refresh via WebSocket
  function connectWS() {
    try {
      const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'files_changed') load();
        } catch(err) {}
      };
      ws.onclose = () => {
        console.log("WebSocket closed. Reconnecting in 5s...");
        setTimeout(connectWS, 5000);
      };
    } catch(err) {
      setTimeout(connectWS, 5000);
    }
  }
  connectWS();
</script>
</body>
</html>
